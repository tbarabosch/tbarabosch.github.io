---
layout: default
---

<main id="main-content" class="main-content" tabindex="-1">
  <article class="manual-page">
    <section class="manual-section" aria-labelledby="page-title">
      <p class="manual-label">NAME</p>
      <div class="manual-name">
        <h1 id="page-title" class="manual-title">{{ page.title }}</h1>
      </div>
    </section>
    <section class="manual-section" aria-labelledby="page-section-heading">
      <h2 id="page-section-heading" class="manual-label">{{ page.section_label | default: 'DESCRIPTION' | escape }}</h2>
      <div class="post-content">
        {{content}}
      </div><!-- .post-content -->
    </section>
  </article><!-- .manual-page -->
</main><!-- .site-main -->
