name: Rebuild GitHub Pages

on:
  schedule:
    - cron: "17 12 * * *"
      timezone: "Europe/Madrid"
  workflow_dispatch:

permissions:
  pages: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Request GitHub Pages rebuild
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh api
          --method POST
          --header "X-GitHub-Api-Version: 2026-03-10"
          "repos/${GITHUB_REPOSITORY}/pages/builds"
